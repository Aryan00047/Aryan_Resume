<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Fallback for browsers that do not take SVG favicons (older Safari). -->
        <link rel="icon" type="image/png" href="/assets/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f6f3ec" />
        <meta name="color-scheme" content="light dark" />
        <script>
            (function () {
                var t = "light";
                try {
                    var saved = localStorage.getItem("theme");
                    if (saved === "dark" || saved === "light") t = saved;
                } catch (e) {}
                document.documentElement.dataset.theme = t;
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#f6f3ec" : "#141311");
            })();
        </script>
        <meta name="description" content="Aryan Gupta — software engineer. 2.5 years shipping React, Node.js, Angular and TypeScript modules end to end inside a regulated healthcare platform." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
        <title>Aryan Gupta | Software Engineer</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>

</html>
